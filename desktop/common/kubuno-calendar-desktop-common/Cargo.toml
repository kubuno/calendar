[package]
name        = "kubuno-calendar-desktop-common"
description = "Kubuno Calendar, the portable app: the launch options, the calendar view state, the offline sample dataset and the platform extension points (clock, launch rules, UI host) every OS entry point registers. Framework- and OS-free so it builds for any target and its logic is unit-tested without a window; the Win32 user interface lives in desktop/windows."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

# Portable on purpose: no `windows` crate, no UI framework. The native user interfaces live in the OS folders
# (desktop/windows: the Win32 window painted through the framework's Graphics). The live-server REST path (the
# shell's token broker) is deferred to a later increment; Increment A renders from the sample dataset.
[dependencies]
kubuno-calendar-core.workspace = true
serde.workspace      = true
serde_json.workspace = true
tracing.workspace    = true
