[module]
id           = "calendar"
display_name = "Calendar"
version      = "0.1.6"
description  = "Calendriers, événements, CalDAV, planification collaborative"
author       = "Kubuno Contributors"
license      = "AGPL-3.0"
runtime      = "rust"
# Per-user settings page (reached via the header gear). Instance-wide settings are
# configured from the core admin console, not from a route inside the module.
settings_path = "/calendar/user-settings"

[process]
entrypoint = "kubuno-calendar"
args       = []

[server]
host = "127.0.0.1"
port = 3102

[routes]
patterns = [
    { method = "*", path = "/*" },
]

[[sidebar_items]]
id       = "calendar"
label    = "Calendar"
icon     = "Calendar"
path     = "/calendar"
position = 20
section  = "main"

[[sidebar_items]]
id       = "calendar-new-event"
label    = "Planification"
icon     = "Users"
path     = "/calendar/scheduling"
position = 21
section  = "main"

# ── Settings manifest ───────────────────────────────────────────────────────────
# Declarative source of truth for the module's parameters. The core seeds the
# instance-level rows (scope global|overridable) into core.settings and resolves the
# effective value (user override ?? global default) per user.
#   scope = "global"      → admin only, instance-wide
#   scope = "user"        → per-user only
#   scope = "overridable" → admin default, each user may override it

#
# `category` groups the settings into the sections of the settings page. The
# `label`/`description` below are fallbacks: the frontend translates each row
# through the `setting_<key>` / `setting_<key>_help` i18n keys when they exist.

# ── Admin panel pages ─────────────────────────────────────────────────────────
# Each becomes an entry of the admin menu (Modules → Calendar), at its own
# address (/admin/modules/calendar/<id>). A setting's `group` places it on a
# page; its `category` becomes a tab inside that page. Only instance-scoped
# settings (global | overridable) reach the admin panel; the per-user ones stay
# on the module's own settings page.

[[setting_groups]]
id          = "defaults"
label       = "Valeurs par défaut"
icon        = "SlidersHorizontal"
position    = 1
description  = "Ce que voit un nouvel utilisateur avant d'avoir rien réglé : fuseau, format d'heure, durée et rappel par défaut, premier jour de la semaine. Les réglages surchargeables restent modifiables par chacun."

[[setting_groups]]
id          = "sharing"
label       = "Partage et visibilité"
icon        = "Share2"
position    = 2
description = "Ce qui sort de l'instance et ce que les comptes voient les uns des autres : agendas publiés, niveau de détail d'un flux public, disponibilités internes, invités extérieurs."

[[setting_groups]]
id          = "features"
label       = "Fonctionnalités"
icon        = "ToggleRight"
position    = 3
description  = "Les fonctions d'agenda ouvertes ou fermées à l'échelle de l'instance."

[[setting_groups]]
id          = "limits"
label       = "Limites et conservation"
icon        = "Gauge"
position    = 4
description = "Plafonds appliqués par le serveur et durée de conservation des événements terminés."

# ── Langue et région ──────────────────────────────────────────────────────────

[[settings]]
key     = "default_timezone"
scope   = "global"
group   = "defaults"
type    = "enum"
default = "Europe/Paris"
category = "Région"
label   = "Fuseau horaire de repli"
description = "Un nouvel agenda prend le fuseau horaire de la personne qui le crée. Ce réglage ne s'y substitue jamais : il ne sert que lorsque ce fuseau n'est pas connu — un agenda créé par le serveur, ou un appareil qui n'annonce rien d'exploitable."
values  = ["Europe/Paris", "Europe/London", "Europe/Berlin", "America/New_York", "America/Los_Angeles", "Africa/Douala", "Asia/Dubai", "Asia/Tokyo", "UTC"]

[[settings]]
key     = "date_format"
scope   = "user"
type    = "enum"
default = "auto"
category = "Région"
label   = "Format de date"
description = "Écriture des dates numériques dans l'agenda."
values  = [
    { value = "auto",       label = "Automatique (selon la langue)" },
    { value = "dd/MM/yyyy", label = "31/12/2026" },
    { value = "MM/dd/yyyy", label = "12/31/2026" },
    { value = "yyyy-MM-dd", label = "2026-12-31" },
    { value = "dd.MM.yyyy", label = "31.12.2026" },
]

[[settings]]
key     = "time_format"
scope   = "overridable"
group   = "defaults"
type    = "enum"
default = "24h"
category = "Région"
label   = "Format horaire"
description = "Affichage des heures sur 24 h ou avec AM/PM."
values  = [
    { value = "24h", label = "24 h (14:30)" },
    { value = "12h", label = "12 h (2:30 PM)" },
]

# ── Fuseau horaire ────────────────────────────────────────────────────────────

[[settings]]
key     = "secondary_timezone"
scope   = "user"
type    = "enum"
default = ""
category = "Fuseau horaire"
label   = "Fuseau horaire secondaire"
description = "Seconde colonne d'heures dans les vues Jour et Semaine."
values  = [
    { value = "",                    label = "Aucun (désactivé)" },
    "Europe/Paris", "Europe/London", "Europe/Berlin", "Europe/Lisbon", "Europe/Moscow",
    "America/New_York", "America/Chicago", "America/Los_Angeles", "America/Sao_Paulo",
    "Africa/Douala", "Africa/Casablanca", "Africa/Nairobi", "Africa/Johannesburg",
    "Asia/Dubai", "Asia/Kolkata", "Asia/Shanghai", "Asia/Tokyo",
    "Australia/Sydney", "Pacific/Auckland", "UTC",
]

# ── Paramètres des événements ─────────────────────────────────────────────────

[[settings]]
key     = "default_event_duration_min"
scope   = "overridable"
group   = "defaults"
type    = "enum"
default = 60
category = "Événements"
label   = "Durée par défaut"
description = "Durée appliquée à un nouvel événement."
values  = [
    { value = 15,  label = "15 minutes" },
    { value = 30,  label = "30 minutes" },
    { value = 45,  label = "45 minutes" },
    { value = 60,  label = "60 minutes" },
    { value = 90,  label = "90 minutes" },
    { value = 120, label = "120 minutes" },
]

[[settings]]
key     = "speedy_meetings"
scope   = "user"
type    = "bool"
default = false
category = "Événements"
label   = "Réunions abrégées"
description = "Terminer 5 minutes plus tôt pour les réunions de 30 minutes, ou 10 minutes plus tôt pour les réunions plus longues."

[[settings]]
key     = "default_reminder_min"
scope   = "overridable"
group   = "defaults"
type    = "enum"
default = 10
category = "Événements"
label   = "Notification par défaut"
description = "Rappel ajouté automatiquement aux nouveaux événements."
values  = [
    { value = 0,    label = "Aucune" },
    { value = 5,    label = "5 minutes avant" },
    { value = 10,   label = "10 minutes avant" },
    { value = 15,   label = "15 minutes avant" },
    { value = 30,   label = "30 minutes avant" },
    { value = 60,   label = "1 heure avant" },
    { value = 1440, label = "1 jour avant" },
]

# ── Paramètres de notification ────────────────────────────────────────────────

[[settings]]
key     = "notifications_mode"
scope   = "user"
type    = "enum"
default = "in_app"
category = "Notifications"
label   = "Notifications"
description = "Comment les rappels d'événements vous sont présentés."
values  = [
    { value = "off",     label = "Désactivées" },
    { value = "in_app",  label = "Notifications dans Kubuno" },
    { value = "desktop", label = "Notifications sur le bureau" },
]

[[settings]]
key     = "notification_sound"
scope   = "user"
type    = "bool"
default = true
category = "Notifications"
label   = "Activer les notifications sonores"

[[settings]]
key     = "notify_only_if_accepted"
scope   = "user"
type    = "bool"
default = false
category = "Notifications"
label   = "M'avertir uniquement si j'ai répondu « Oui » ou « Peut-être »"

# ── Options d'affichage ───────────────────────────────────────────────────────

[[settings]]
key     = "show_holidays"
scope   = "user"
type    = "bool"
default = true
category = "Affichage"
label   = "Afficher les jours fériés"
description = "Les jours fériés du territoire qui vous concerne apparaissent comme un agenda en lecture seule, activable dans la barre latérale."

[[settings]]
key     = "holiday_calendars"
scope   = "user"
type    = "string"
default = ""
category = "Affichage"
label   = "Territoires des jours fériés"
description = "Codes séparés par des virgules (« FR », « FR-6AE,BE »). Laissé vide, le territoire est celui défini par l'administration, ou déduit de votre fuseau horaire."

[[settings]]
key     = "show_weekends"
scope   = "user"
type    = "bool"
default = true
category = "Affichage"
label   = "Afficher les week-ends"

[[settings]]
key     = "show_declined_events"
scope   = "user"
type    = "bool"
default = true
category = "Affichage"
label   = "Afficher les événements refusés"

[[settings]]
key     = "show_week_numbers"
scope   = "user"
type    = "bool"
default = false
category = "Affichage"
label   = "Afficher le numéro des semaines"

[[settings]]
key     = "min_event_height"
scope   = "user"
type    = "bool"
default = false
category = "Affichage"
label   = "Afficher les événements courts à la même taille que les événements d'une durée minimum de 30 minutes"

[[settings]]
key     = "dim_past_events"
scope   = "user"
type    = "bool"
default = true
category = "Affichage"
label   = "Réduire la luminosité des événements passés"

[[settings]]
key     = "week_starts_on"
scope   = "overridable"
group   = "defaults"
type    = "enum"
default = "monday"
category = "Affichage"
label   = "Premier jour de la semaine"
description = "Jour affiché en première colonne des vues Mois et Semaine."
values  = [
    { value = "monday",   label = "Lundi" },
    { value = "sunday",   label = "Dimanche" },
    { value = "saturday", label = "Samedi" },
]

[[settings]]
key     = "custom_view_days"
scope   = "user"
type    = "enum"
default = 4
category = "Affichage"
label   = "Définir la vue personnalisée"
description = "Nombre de jours de la vue personnalisée (raccourci clavier X)."
values  = [
    { value = 2, label = "2 jours" },
    { value = 3, label = "3 jours" },
    { value = 4, label = "4 jours" },
    { value = 5, label = "5 jours" },
    { value = 6, label = "6 jours" },
    { value = 7, label = "7 jours" },
]

[[settings]]
key     = "default_view"
scope   = "user"
type    = "enum"
default = "month"
category = "Affichage"
label   = "Vue par défaut"
description = "Affichage utilisé à l'ouverture de l'agenda."
values  = [
    { value = "day",      label = "Jour" },
    { value = "week",     label = "Semaine" },
    { value = "month",    label = "Mois" },
    { value = "year",     label = "Année" },
    { value = "schedule", label = "Planning" },
    { value = "custom",   label = "Vue personnalisée" },
]

[[settings]]
key     = "day_start_hour"
scope   = "user"
type    = "enum"
default = "8"
category = "Affichage"
label   = "Heure de début de journée"
description = "Heure sur laquelle les vues Jour et Semaine se positionnent."
values  = ["0", "6", "7", "8", "9", "10", "12"]

# ── Heures et lieu de travail ─────────────────────────────────────────────────
# The per-day schedule (ranges + location) is a bespoke control (WorkingHoursField)
# stored in the preference bag; the scalar-only manifest cannot express it.
# `allow_working_location` is the instance-wide admin toggle (like Google Workspace's
# admin console: "Allow users to set their daily working location", on by default).

# ── Partage et visibilité ─────────────────────────────────────────────────────
# Toutes ces valeurs sont appliquées par le serveur du module (voir
# src/config/instance.rs et les gardes qui la lisent) : refuser une publication,
# amincir un flux public, restreindre les disponibilités, refuser un invité.

[[settings]]
key     = "allow_public_calendars"
scope   = "global"
group   = "sharing"
type    = "bool"
default = true
category = "Partage externe"
label   = "Autoriser la publication d'un agenda"
description = "Un agenda publié expose un lien .ics accessible sans compte. Désactivé, les liens déjà distribués cessent de répondre et plus aucun agenda ne peut être publié."

[[settings]]
key     = "public_calendar_detail"
scope   = "global"
group   = "sharing"
type    = "enum"
default = "full"
category = "Partage externe"
label   = "Détail d'un agenda publié"
description = "Ce qu'un flux public laisse voir aux personnes extérieures."
values  = [
    { value = "full", label = "Toutes les informations (titre, description, lieu)" },
    { value = "busy", label = "Disponibilités seulement (créneaux occupés, sans détail)" },
]

[[settings]]
key     = "internal_free_busy"
scope   = "global"
group   = "sharing"
type    = "enum"
default = "everyone"
category = "Partage interne"
label   = "Disponibilités entre comptes de l'instance"
description = "Qui peut consulter les créneaux occupés d'une autre personne lors d'une recherche de disponibilité (jamais le détail des événements)."
values  = [
    { value = "everyone",    label = "Tout le monde dans l'instance" },
    { value = "shared_only", label = "Uniquement les personnes qui m'ont partagé un agenda" },
]

[[settings]]
key     = "allow_external_guests"
scope   = "global"
group   = "sharing"
type    = "bool"
default = true
category = "Invitations externes"
label   = "Autoriser les invités extérieurs"
description = "Inviter une adresse qui n'appartient ni aux domaines de l'instance ni à un compte existant. Désactivé, l'invitation est refusée par le serveur."

[[settings]]
key     = "warn_external_guests"
scope   = "global"
group   = "sharing"
type    = "bool"
default = true
category = "Invitations externes"
label   = "Avertir avant d'inviter une adresse extérieure"
description = "Affiche un avertissement dans la composition d'un événement lorsque l'adresse saisie n'est pas dans un domaine de l'instance."

[[settings]]
key     = "send_email_invitations"
scope   = "global"
group   = "sharing"
type    = "bool"
default = true
category = "Invitations par e-mail"
label   = "Envoyer les invitations par e-mail"
description = "À la création, la modification ou l'annulation d'un événement comportant des invités, le serveur demande au module Courrier d'envoyer les invitations (fichier iCalendar joint). Désactivé, les invités sont enregistrés mais aucun courrier n'est envoyé."

# ── Limites et conservation ───────────────────────────────────────────────────

[[settings]]
key     = "max_event_guests"
scope   = "global"
group   = "limits"
type    = "int"
default = 0
min     = 0
max     = 100000
category = "Limites"
label   = "Limite du nombre de participants par événement"
description = "Aucune limite n'est imposée par défaut : c'est à vous d'en fixer une si votre instance en a besoin. Saisissez le nombre de participants au-delà duquel le serveur refuse l'ajout à un événement ; laissez 0 pour n'imposer aucune limite."

[[settings]]
key     = "max_calendars_per_user"
scope   = "global"
group   = "limits"
type    = "int"
default = 0
min     = 0
max     = 10000
category = "Limites"
label   = "Nombre maximal d'agendas par compte"
description = "Plafond appliqué à la création d'un agenda et à l'abonnement à un agenda distant. Le premier agenda, créé automatiquement, n'est jamais refusé. 0 = illimité."

[[settings]]
key     = "event_retention_days"
scope   = "global"
group   = "limits"
type    = "int"
default = 0
min     = 0
max     = 3650
category = "Conservation"
label   = "Conservation des événements terminés (jours)"
description = "Au-delà de ce délai, un événement terminé est supprimé définitivement par le serveur. Les séries récurrentes et les agendas synchronisés depuis une source distante ne sont jamais purgés. 0 = conserver indéfiniment."

[[settings]]
key     = "allow_calendar_subscriptions"
scope   = "global"
group   = "features"
type    = "bool"
default = true
category = "Abonnements"
label   = "Autoriser les abonnements à un agenda distant"
description = "Un abonnement fait télécharger périodiquement par l'instance une adresse choisie par l'utilisateur. Désactivé, la synchronisation des abonnements existants s'arrête aussi."

[[settings]]
key     = "allow_appointment_schedules"
scope   = "global"
group   = "features"
type    = "bool"
default = true
category = "Rendez-vous"
label   = "Autoriser les pages de rendez-vous"
description = "Une page de rendez-vous propose publiquement des créneaux réservables. Désactivé, les liens déjà partagés ne répondent plus."

[[settings]]
key     = "allow_working_location"
scope   = "global"
group   = "features"
type    = "bool"
default = true
category = "Lieu de travail"
label   = "Autoriser le lieu de travail"
description = "Permettre aux utilisateurs de définir leur lieu de travail quotidien (bureau, domicile…), affiché dans leur agenda."

# ── Raccourcis clavier ────────────────────────────────────────────────────────

[[settings]]
key     = "keyboard_shortcuts"
scope   = "user"
type    = "bool"
default = true
category = "Raccourcis"
label   = "Activer les raccourcis clavier"
description = "Appuyez sur le point d'interrogation (?) pour afficher la liste des raccourcis disponibles."

[events]
subscribed = [
    "UserDeleted",
    "ContactUpdated",
    # RSVP replies relayed by the Mail module (attendee accepted / declined / …).
    "mail.invite_reply",
]
publishes = [
    "EventCreated",
    # Meeting invitations / cancellations, consumed by the Mail module to send
    # the invitation e-mails (module→module data channel, no user push).
    "calendar.invite",
]
